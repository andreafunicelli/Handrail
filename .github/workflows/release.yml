name: Release

# Every push to main builds installers (macOS universal .dmg, Windows .exe + .msi, Linux
# .AppImage + .deb + .rpm) and
# publishes them as a GitHub Release of this repository named v<major>.<minor>.<patch>, the patch
# one past the last release of that major.minor (the updater only offers newer versions; the
# major.minor comes from the workspace version in Cargo.toml).
# The release notes are a changelog: the pull requests merged since the previous release
# (.github/scripts/changelog.sh). Pull requests build the same installers as downloadable
# workflow artifacts, without a release.
#
# Pushes to the `nightly` branch publish a *prerelease* for testing, never a release:
#   - version <major.minor>.<next patch>-<run number> (e.g. 1.1.0-212), so the next stable
#     release of that major.minor is newer and a nightly install updates to it;
#   - tag nightly-<version>: not v*, so the stable version count and changelog ignore it;
#   - installed as "Handrail Nightly" (identifier dev.handrail.nightly): its own data directory,
#     beside the stable app, never in place of it (on Linux, side by side only as an AppImage:
#     both .deb/.rpm packages install /usr/bin/handrail-rdp);
#   - nightly installs update from the rolling prerelease `nightly-latest`, whose latest.json each
#     nightly replaces. Stable installs never see prereleases (releases/latest skips them).
# Manual runs publish only from main (stable) or nightly; from other refs they only build.
#
# Nothing is published unless the same commit passed CI: pushes and manual runs first run
# ci.yml (the `checks` job), and `prepare` and `build` need it. Pull requests skip that call,
# since ci.yml runs on pull_request by itself; their builds run in `build-only`, read-only.
#
# A stable release becomes the one installed apps update to ("latest") only once every build
# has uploaded its installers: `prepare` creates it as not-latest, the builds fill it, `promote`
# marks it latest. Until then apps keep seeing the previous, complete release (an app asking
# while a build was still running used to find a latest.json without its platform).
#
# Optional secrets (the workflow still produces installers without them):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       Updater signing key (`npx tauri signer generate`). With it, the release also carries
#       latest.json and .sig files, which installed apps use to update themselves.

on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

# Read-only by default; the jobs that create or edit releases ask for write themselves.
permissions:
  contents: read

# Publishing runs (pushes and manual runs, from any ref) share one group and run one at a time:
# each picks the next version from the tags the previous one created, so two can never take the
# same version. (A newer queued run replaces an older queued one; its changelog covers both.)
# Pull request runs only build, so a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CI
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history and its tags: the changelog starts at the previous release tag.
          fetch-depth: 0
      - id: v
        name: Compute version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\.[0-9]*"$/\1/p' Cargo.toml | head -n 1)
          test -n "$base" || { echo "no workspace version in Cargo.toml" >&2; exit 1; }
          # The patch counts releases of this major.minor: one past the highest v<base>.N tag, so a
          # new base (1.0) starts at .0. Pull request builds get the same number (never published).
          last=$(git tag -l "v${base}.*" | sed -n "s/^v${base//./\\.}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
          version="${base}.$(( ${last:--1} + 1 ))"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            channel=none
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            channel=stable
          elif [ "$GITHUB_REF" = refs/heads/nightly ]; then
            channel=nightly
          else
            channel=none
          fi
          if [ "$channel" = nightly ]; then
            # Numeric pre-release only: the Windows .msi refuses anything else (and above 65535).
            version="${version}-${GITHUB_RUN_NUMBER}"
            tag="nightly-${version}"
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - id: notes
        name: Write the release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo 'body<<HANDRAIL_NOTES_EOF'
            # A release with notes written for it (docs/release-notes-<version>.md) starts with
            # them, without their title (the release has its own); the changes list follows.
            written="docs/release-notes-${VERSION}.md"
            if [ -f "$written" ]; then
              sed '1{/^# /d}' "$written"
              echo
            fi
            bash .github/scripts/changelog.sh
            echo
            echo '## Install'
            echo
            echo 'The builds are not code-signed yet:'
            echo '- macOS: open the .dmg, drag Handrail to Applications; the first time, open System Settings > Privacy & Security and click "Open Anyway".'
            echo '- Windows: on the SmartScreen warning click "More info" > "Run anyway".'
            echo '- Linux (glibc 2.35 or newer: Ubuntu 22.04, Debian 12, Fedora 36 and later): install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE), or make the .AppImage executable (chmod +x) and run it.'
            echo 'HANDRAIL_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  # Stable only: the release exists before the builds upload to it, and is not "latest" yet.
  prepare:
    name: Create the release (not latest yet)
    needs: [version, checks]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      NOTES: ${{ needs.version.outputs.notes }}
    steps:
      - name: Create the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG exists (a re-run): the builds upload to it."
            exit 0
          fi
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Handrail $VERSION" --notes-file notes.md --latest=false

  # Publishing builds (stable and nightly). `build-only` below runs the same matrix and steps
  # (YAML aliases of the anchors here) read-only, for pull requests and manual runs elsewhere.
  build:
    needs: [version, checks, prepare]
    # `prepare` is skipped for nightlies; `checks` must have passed (a failed `checks` skips
    # `prepare`, which on its own would not stop this job).
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.channel != 'none' && needs.checks.result == 'success' && needs.prepare.result != 'failure' }}
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy: &build-strategy
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: ""
          # The oldest supported runner: binaries built against its glibc (2.35) also run on
          # newer distributions, not the other way round.
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    env: &build-env
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.channel != 'none' }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps: &build-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-14
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the RDP helper
        shell: bash
        run: node scripts/build-rdp-helper.mjs ${{ matrix.args }}

      - name: Stamp version and release config
        shell: bash
        run: |
          # Workspace version (the single source; the app reads it via CARGO_PKG_VERSION).
          perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          updater=false
          [ "$HAS_UPDATER_KEY" = "true" ] && updater=true
          if [ "$CHANNEL" = nightly ]; then
            # A merged config replaces arrays whole: the window list is the base one, retitled.
            jq --arg v "$VERSION" --argjson u "$updater" \
              --arg e "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly-latest/latest.json" \
              '{version: $v, productName: "Handrail Nightly", identifier: "dev.handrail.nightly",
                app: {windows: (.app.windows | map(.title = "Handrail Nightly"))},
                bundle: {createUpdaterArtifacts: $u}, plugins: {updater: {endpoints: [$e]}}}' \
              src-tauri/tauri.conf.json > src-tauri/tauri.release.conf.json
          else
            printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s}}\n' "$VERSION" "$updater" \
              > src-tauri/tauri.release.conf.json
          fi
          cat src-tauri/tauri.release.conf.json

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No tag on pull requests: tauri-action then only builds.
          tagName: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && format(env.CHANNEL == 'nightly' && 'Handrail Nightly {0}' || 'Handrail {0}', env.VERSION) || '' }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ env.CHANNEL == 'nightly' }}
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload installers (pull requests)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Handrail-${{ env.VERSION }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  # Pull requests and manual runs from other refs (channel none): the same build, no release, no
  # write permission. It does not wait for `checks`: it publishes nothing.
  build-only:
    needs: version
    if: needs.version.outputs.channel == 'none'
    name: Build (${{ matrix.name }})
    strategy: *build-strategy
    runs-on: ${{ matrix.platform }}
    env: *build-env
    steps: *build-steps

  promote:
    name: Make the release the latest
    needs: [version, build]
    # Explicit results: a skipped job further up (`prepare` on nightlies) would otherwise skip
    # every job below it, even after the builds succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.version.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Mark the release latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

  # Nightly installs look for updates in the rolling prerelease `nightly-latest`: give it this
  # nightly's latest.json (which links to this nightly's installers).
  nightly-pointer:
    name: Point nightly installs here
    needs: [version, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.version.outputs.channel == 'nightly' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Copy latest.json to nightly-latest
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json; then
            echo "No latest.json in $TAG (no updater signing key): nightly installs cannot update themselves."
            exit 0
          fi
          if ! gh release view nightly-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Handrail Nightly (update channel)" \
              --notes "Update channel of Handrail Nightly builds: holds only the latest.json of the newest nightly. Download installers from the nightly-* prereleases."
          fi
          gh release upload nightly-latest latest.json --repo "$GITHUB_REPOSITORY" --clobber
