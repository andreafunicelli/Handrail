name: Release

# Every push to main builds installers (macOS universal .dmg, Windows .exe + .msi, Linux
# .AppImage + .deb + .rpm) and
# publishes them as a GitHub Release of this repository named v<major>.<minor>.<patch>, the patch
# one past the last release of that major.minor (the updater only offers newer versions; the
# major.minor comes from the workspace version in Cargo.toml).
# The release notes are a changelog: the pull requests merged since the previous release
# (.github/scripts/changelog.sh). Pull requests build the same installers as downloadable
# workflow artifacts, without a release.
#
# Optional secrets (the workflow still produces installers without them):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       Updater signing key (`npx tauri signer generate`). With it, the release also carries
#       latest.json and .sig files, which installed apps use to update themselves.
#   RELEASES_TOKEN
#       Transition only. Releases used to go to andreafunicelli/handrail-releases, and apps
#       installed from there still look for updates there. While this secret exists (a token
#       with "Contents: read and write" on that repository), each release's latest.json is
#       copied there too; it points at the installers in this repository, so those apps
#       update to a version that looks here. Delete the secret once they have updated.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Publishing runs (pushes and manual runs, from any ref) share one group and run one at a time:
# each picks the next version from the tags the previous one created, so two can never take the
# same version. (A newer queued run replaces an older queued one; its changelog covers both.)
# Pull request runs only build, so a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.ref) || 'release-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: the changelog starts at the previous release tag.
          fetch-depth: 0
      - id: notes
        name: Write the changelog
        run: |
          {
            echo 'body<<HANDRAIL_NOTES_EOF'
            bash .github/scripts/changelog.sh
            echo
            echo '## Install'
            echo
            echo 'The builds are not code-signed yet:'
            echo '- macOS: open the .dmg, drag Handrail to Applications; the first time, open System Settings > Privacy & Security and click "Open Anyway".'
            echo '- Windows: on the SmartScreen warning click "More info" > "Run anyway".'
            echo '- Linux (glibc 2.35 or newer: Ubuntu 22.04, Debian 12, Fedora 36 and later): install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE), or make the .AppImage executable (chmod +x) and run it.'
            echo 'HANDRAIL_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: v
        name: Compute version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\.[0-9]*"$/\1/p' Cargo.toml | head -n 1)
          test -n "$base" || { echo "no workspace version in Cargo.toml" >&2; exit 1; }
          # The patch counts releases of this major.minor: one past the highest v<base>.N tag, so a
          # new base (1.0) starts at .0. Pull request builds get the same number (never published).
          last=$(git tag -l "v${base}.*" | sed -n "s/^v${base//./\\.}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
          echo "version=${base}.$(( ${last:--1} + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: ""
          # The oldest supported runner: binaries built against its glibc (2.35) also run on
          # newer distributions, not the other way round.
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the RDP helper
        shell: bash
        run: node scripts/build-rdp-helper.mjs ${{ matrix.args }}

      - name: Stamp version and release config
        shell: bash
        run: |
          # Workspace version (the single source; the app reads it via CARGO_PKG_VERSION).
          perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          updater=false
          [ "$HAS_UPDATER_KEY" = "true" ] && updater=true
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s}}\n' "$VERSION" "$updater" \
            > src-tauri/tauri.release.conf.json
          cat src-tauri/tauri.release.conf.json

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No tag on pull requests: tauri-action then only builds.
          tagName: ${{ env.PUBLISH == 'true' && format('v{0}', env.VERSION) || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && format('Handrail {0}', env.VERSION) || '' }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload installers (pull requests)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Handrail-${{ env.VERSION }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  # Transition: apps installed from andreafunicelli/handrail-releases look for updates there.
  # Copy this release's latest.json (which links to the installers here) so they update to a
  # version that looks in this repository. Off once the RELEASES_TOKEN secret is deleted.
  bridge:
    name: Point old installs here
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
      BRIDGE_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Copy latest.json to handrail-releases
        if: env.BRIDGE_TOKEN != ''
        run: |
          if ! GH_TOKEN="${{ github.token }}" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json; then
            echo "No latest.json in $TAG (no updater signing key): nothing to point old installs to."
            exit 0
          fi
          GH_TOKEN="$BRIDGE_TOKEN" gh release create "$TAG" latest.json \
            --repo andreafunicelli/handrail-releases --target main \
            --title "Handrail ${TAG#v}" \
            --notes "Handrail releases have moved to https://github.com/$GITHUB_REPOSITORY/releases. This entry only lets older installs update."
