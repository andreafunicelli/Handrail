name: Release

# Every push to main builds installers (macOS universal .dmg, Windows .exe + .msi) and
# publishes them as a GitHub Release named v<major>.<minor>.<run number>, so each build has a
# higher version than the last (the updater only offers newer versions). Pull requests build
# the same installers as downloadable workflow artifacts, without a release.
#
# Optional secrets (the workflow still produces installers without them):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       Updater signing key (`npx tauri signer generate`). With it, the release also carries
#       latest.json and .sig files, which installed apps use to update themselves.
#   RELEASES_TOKEN
#       Fine-grained token with "Contents: read and write" on the public
#       andreafunicelli/handrail-releases repository. With it, releases go there, where the
#       app's updater can reach them; without it, they go to this (private) repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Compute version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\.[0-9]*"$/\1/p' Cargo.toml | head -n 1)
          test -n "$base" || { echo "no workspace version in Cargo.toml" >&2; exit 1; }
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Stamp version and release config
        shell: bash
        run: |
          # Workspace version (the single source; the app reads it via CARGO_PKG_VERSION).
          perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version = ' Cargo.toml
          updater=false
          [ "$HAS_UPDATER_KEY" = "true" ] && updater=true
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":%s}}\n' "$VERSION" "$updater" \
            > src-tauri/tauri.release.conf.json
          cat src-tauri/tauri.release.conf.json

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ env.HAS_RELEASES_TOKEN == 'true' && 'andreafunicelli' || github.repository_owner }}
          repo: ${{ env.HAS_RELEASES_TOKEN == 'true' && 'handrail-releases' || github.event.repository.name }}
          # The public releases repo has none of this repo's commits: tag its default branch.
          releaseCommitish: ${{ env.HAS_RELEASES_TOKEN == 'true' && 'main' || github.sha }}
          # No tag on pull requests: tauri-action then only builds.
          tagName: ${{ env.PUBLISH == 'true' && format('v{0}', env.VERSION) || '' }}
          releaseName: ${{ env.PUBLISH == 'true' && format('Handrail {0}', env.VERSION) || '' }}
          releaseBody: |
            Test build ${{ env.VERSION }} from ${{ github.sha }}.

            The builds are not code-signed yet:
            - macOS: open the .dmg, drag Handrail to Applications; the first time, open System Settings > Privacy & Security and click "Open Anyway".
            - Windows: on the SmartScreen warning click "More info" > "Run anyway".
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Upload installers (pull requests)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Handrail-${{ env.VERSION }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
