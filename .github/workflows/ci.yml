name: CI

# Pull requests run this workflow directly. Pushes to main and nightly (and manual runs) run it
# through release.yml, which calls it and publishes nothing unless it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# When called, github.* is the caller's context (push / workflow_dispatch): release.yml already
# runs those one at a time, and a publishing run's checks must never be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-14
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri's build script requires ui/dist (frontendDist in tauri.conf.json).
      - name: Build frontend
        run: npm run build

      # ...and the RDP helper (externalBin). Checking and testing the app need only a stand-in;
      # the helper is built and tested in its own job below.
      - name: RDP helper stand-in
        run: node scripts/build-rdp-helper.mjs --placeholder

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A real OpenSSH server for aht-ssh/tests/real_sftp.rs (which skips where these vars are unset).
      - name: Start sshd for the SFTP test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y openssh-server
          ssh-keygen -t ed25519 -N "" -q -f "$RUNNER_TEMP/handrail_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && chmod go-w ~
          cat "$RUNNER_TEMP/handrail_key.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          echo "HANDRAIL_SSH_TEST=$(whoami)@127.0.0.1:22" >> "$GITHUB_ENV"
          echo "HANDRAIL_SSH_TEST_KEY=$RUNNER_TEMP/handrail_key" >> "$GITHUB_ENV"

      # A real S3-compatible store (versitygw, which checks SigV4 signatures) for
      # aht-s3/tests/real_s3.rs; the bucket is created with curl's own signer, an independent
      # check of ours.
      - name: Start an S3 server for the S3 test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/vgw" "$RUNNER_TEMP/s3data"
          curl -fsSL -o "$RUNNER_TEMP/versitygw.tar.gz" \
            https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Linux_x86_64.tar.gz
          # From the release's checksums.txt; verified before anything from the archive runs.
          echo "2ba2c734d10d2c4e651d03182cb4b246656bc735a2f282db7b0b73fba6073467  $RUNNER_TEMP/versitygw.tar.gz" \
            | sha256sum -c -
          tar xzf "$RUNNER_TEMP/versitygw.tar.gz" -C "$RUNNER_TEMP/vgw" --strip-components=1
          ROOT_ACCESS_KEY=handrail ROOT_SECRET_KEY=handrail-ci-secret \
            nohup "$RUNNER_TEMP/vgw/versitygw" --port 127.0.0.1:9000 posix "$RUNNER_TEMP/s3data" > "$RUNNER_TEMP/vgw.log" 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user handrail:handrail-ci-secret \
            http://127.0.0.1:9000/handrail-test
          {
            echo "HANDRAIL_S3_TEST=http://127.0.0.1:9000"
            echo "HANDRAIL_S3_BUCKET=handrail-test"
            echo "HANDRAIL_S3_KEY=handrail"
            echo "HANDRAIL_S3_SECRET=handrail-ci-secret"
          } >> "$GITHUB_ENV"

      # Real MySQL 8 and PostgreSQL 16 for aht-db/tests/real_db.rs.
      - name: Start MySQL and PostgreSQL for the database tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo systemctl stop mysql 2>/dev/null || true
          docker run -d --name hr-mysql -e MYSQL_ROOT_PASSWORD=handrail-ci -e MYSQL_DATABASE=handrail \
            -p 127.0.0.1:3306:3306 mysql:8.4
          docker run -d --name hr-pg -e POSTGRES_PASSWORD=handrail-ci -e POSTGRES_DB=handrail \
            -p 127.0.0.1:5432:5432 postgres:16
          # MySQL's image starts a temporary server first; the real one listens on port 3306.
          for _ in $(seq 90); do docker logs hr-mysql 2>&1 | grep -q "port: 3306" && break; sleep 2; done
          for _ in $(seq 60); do docker exec hr-pg pg_isready -U postgres -d handrail && break; sleep 1; done
          {
            echo "HANDRAIL_MYSQL_TEST=root:handrail-ci@127.0.0.1:3306/handrail"
            echo "HANDRAIL_PG_TEST=postgres:handrail-ci@127.0.0.1:5432/handrail"
          } >> "$GITHUB_ENV"

      # The integration tests skip themselves when their variable is unset: a service step that
      # failed to export it must fail the run, not turn into a green one.
      - name: Require the integration-test services (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          missing=0
          for v in HANDRAIL_SSH_TEST HANDRAIL_S3_TEST HANDRAIL_MYSQL_TEST HANDRAIL_PG_TEST; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set; its integration tests would be skipped"; missing=1; fi
          done
          exit "$missing"

      - name: Test
        run: cargo test --workspace --locked

  rdp-helper:
    name: RDP helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-14
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rdp-helper

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path rdp-helper/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path rdp-helper/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path rdp-helper/Cargo.toml --locked

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Errors only: the duplicate-version warnings ran to thousands of lines and pushed
          # the failing advisories out of the retrievable log.
          log-level: error

      # The RDP helper is a workspace of its own (see rdp-helper/Cargo.toml).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # rdp-helper/deny.toml links to the root policy.
          manifest-path: rdp-helper/Cargo.toml
          log-level: error
