name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri's build script requires ui/dist (frontendDist in tauri.conf.json).
      - name: Build frontend
        run: npm run build

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A real OpenSSH server for aht-ssh/tests/real_sftp.rs (skipped where these vars are unset).
      - name: Start sshd for the SFTP test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y openssh-server
          ssh-keygen -t ed25519 -N "" -q -f "$RUNNER_TEMP/handrail_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && chmod go-w ~
          cat "$RUNNER_TEMP/handrail_key.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          echo "HANDRAIL_SSH_TEST=$(whoami)@127.0.0.1:22" >> "$GITHUB_ENV"
          echo "HANDRAIL_SSH_TEST_KEY=$RUNNER_TEMP/handrail_key" >> "$GITHUB_ENV"

      # A real S3-compatible store for aht-s3/tests/real_s3.rs; the bucket is created with curl's
      # own SigV4 signer, an independent check of ours.
      - name: Start MinIO for the S3 test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=handrail -e MINIO_ROOT_PASSWORD=handrail-ci-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user handrail:handrail-ci-secret \
            http://127.0.0.1:9000/handrail-test
          {
            echo "HANDRAIL_S3_TEST=http://127.0.0.1:9000"
            echo "HANDRAIL_S3_BUCKET=handrail-test"
            echo "HANDRAIL_S3_KEY=handrail"
            echo "HANDRAIL_S3_SECRET=handrail-ci-secret"
          } >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Errors only: the duplicate-version warnings ran to thousands of lines and pushed
          # the failing advisories out of the retrievable log.
          log-level: error
