[package]
name = "aht-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["os-keychain"]
os-keychain = ["dep:keyring"]

[dependencies]
aht-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
keyring = { version = "4.2.0", optional = true }
sha2 = "0.11.0"
zeroize = "1.9.1"
hmac = "0.13"

[dev-dependencies]
tempfile = "3.27.0"
