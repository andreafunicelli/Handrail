# cargo-deny configuration (cargo-deny v2 config format).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# Workspace crates are license = "UNLICENSED" and are skipped by the license check.
# NOTE: this only applies to crates marked `publish = false`. Every workspace crate
# (crates/* and src-tauri) must set `publish = false` in its Cargo.toml, otherwise
# the UNLICENSED workspace crates will fail the license check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
