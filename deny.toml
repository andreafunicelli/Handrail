# cargo-deny configuration (cargo-deny v2 config format).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Each entry has no fixed version upstream; revisit when one ships.
ignore = [
    # proc-macro-error is unmaintained. It is a build-time proc macro pulled in by gtk-rs 0.18
    # (glib-macros, gtk3-macros), which Tauri uses on Linux; nothing runs at app runtime.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri's gtk-rs 0.18 on Linux; no upgrade available" },
    # Marvin attack: RSA private-key operations are not constant-time. russh uses `rsa` to sign
    # the client's SSH authentication with a user's RSA key, locally, once per login; the
    # attack needs many timed decryptions observed by the attacker. No patched rsa release.
    # Unmaintained (archived), no known vulnerability; both reach us through IronRDP in the
    # rdp-helper workspace only (rdp-helper/deny.toml links here). Re-check on IronRDP upgrades.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: archived; via IronRDP's sspi -> winscard -> iso7816 -> heapless 0.7 (smart-card path). No upgrade until IronRDP moves off heapless 0.7." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: archived thin wrapper over rustls-pki-types; only via ironrdp-server, a test-only dependency of rdp-helper." },
    # zip 4.x: extraction keeps SUID/SGID bits and follows/creates symlinks outside the target
    # (Unix behaviour). zip reaches us only through tauri-plugin-updater, which builds it for
    # Windows alone and extracts only after the minisign signature check against our key.
    # Fixed in zip 9; no tauri-plugin-updater release accepts it yet (all need ^4).
    { id = "RUSTSEC-2026-0367", reason = "zip 4.x SUID bits on extract; Windows-only via tauri-plugin-updater, signed archives only. Re-check when the updater moves to zip >= 9." },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.x symlink escape on extract; Windows-only via tauri-plugin-updater, signed archives only. Re-check when the updater moves to zip >= 9." },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.x permissions through symlinks; Windows-only via tauri-plugin-updater, signed archives only. Re-check when the updater moves to zip >= 9." },
    # zbus 5's helper crates are no longer released on their own: zbus 6 absorbed them. They
    # reach us only through keyring's Secret Service store (Linux keychain), and no keyring /
    # secret-service release supports zbus 6 yet. Unmaintained, no known vulnerability.
    { id = "RUSTSEC-2026-0370", reason = "zvariant (zbus 5): via keyring's Linux Secret Service store; no release on zbus 6 yet. Re-check on keyring upgrades." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names (zbus 5): via keyring's Linux Secret Service store; no release on zbus 6 yet. Re-check on keyring upgrades." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (zbus 5, proc macro): via keyring's Linux Secret Service store; no release on zbus 6 yet. Re-check on keyring upgrades." },
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing attack; russh uses rsa only for client-side signing during login (a few operations per connection). No patched rsa release (RustCrypto/RSA#626); RSA key login must stay supported. Re-check when rsa ships a fix." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

# Workspace crates are license = "UNLICENSED" and are skipped by the license check.
# NOTE: this only applies to crates marked `publish = false`. Every workspace crate
# (crates/* and src-tauri) must set `publish = false` in its Cargo.toml, otherwise
# the UNLICENSED workspace crates will fail the license check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
