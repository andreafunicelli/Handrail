[package]
name = "aihubterm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aihubterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
aht-core.workspace = true
aht-ssh.workspace = true
aht-term.workspace = true
aht-mcp.workspace = true
aht-agent.workspace = true
aht-providers.workspace = true
aht-harness.workspace = true
aht-sync.workspace = true
aht-import.workspace = true
aht-vault.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
base64 = "0.23.1"
uuid.workspace = true
async-trait.workspace = true
zeroize = "1.9.1"
tokio-util = "0.7.20"
regex = "1.13.1"
